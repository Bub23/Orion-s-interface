version: '3.8'

services:
  ai-system:
    build: .
    container_name: my-local-ai
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=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
      - NVIDIA_MODEL=meta/llama-3.1-8b-instruct
    volumes:
      - ./memories:/app/memories
      - ./chatgpt_exports:/app/chatgpt_exports
    networks:
      - ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ai-network:
    driver: bridge
