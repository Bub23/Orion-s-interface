version: '3.8'

services:
  ai-system:
    build: .
    container_name: my-local-ai
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_MODEL=${NVIDIA_MODEL}
    volumes:
      - ./memories:/app/memories
      - ./chatgpt_exports:/app/chatgpt_exports
    stdin_open: true
    tty: true
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge
