<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion OS - Decision Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: #aaa;
            font-size: 1.1rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.1);
        }
        
        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .emoji {
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button:hover {
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .decision-box {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .decision-title {
            font-size: 1.5rem;
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .decision-reason {
            color: #aaa;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        
        .decision-action {
            background: rgba(0, 212, 255, 0.2);
            padding: 12px;
            border-left: 3px solid #00d4ff;
            margin-top: 10px;
            color: #fff;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .metric {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        
        .metric-label {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        
        .metric-value {
            color: #00d4ff;
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .memory-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #00d4ff;
        }
        
        .memory-content {
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        
        .memory-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
        }
        
        .memory-emotion {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 4px;
            color: #00d4ff;
        }
        
        .content-output {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            line-height: 1.6;
        }
        
        .content-output h3 {
            color: #00d4ff;
            margin-top: 12px;
            margin-bottom: 6px;
            font-size: 0.95rem;
            text-transform: uppercase;
        }
        
        .content-output p {
            color: #ddd;
            margin-bottom: 10px;
        }
        
        .loading {
            text-align: center;
            color: #888;
        }
        
        .search-box {
            margin-bottom: 15px;
        }
        
        .search-input {
            display: flex;
            gap: 10px;
        }
        
        .search-input input {
            flex: 1;
        }
        
        .search-input button {
            width: auto;
            padding: 12px 20px;
        }
        
        .priority-slider {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .priority-slider input {
            flex: 1;
        }
        
        .priority-value {
            color: #00d4ff;
            font-weight: bold;
            min-width: 30px;
        }
        
        .delete-btn {
            background: linear-gradient(45deg, #ff4444, #cc0000);
            padding: 6px 12px;
            font-size: 0.8rem;
            margin-top: 8px;
        }
        
        .success-message {
            background: rgba(0, 255, 100, 0.2);
            border: 1px solid #00ff64;
            color: #00ff64;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 ORION OS</h1>
            <p>Decision Engine + Memory System</p>
        </div>
        
        <div class="grid">
            <!-- LOG MEMORY CARD -->
            <div class="card">
                <h2><span class="emoji">📝</span> Log Memory</h2>
                <div class="success-message" id="success-message">Memory saved!</div>
                
                <div class="form-group">
                    <label>What's on your mind?</label>
                    <textarea id="memory-content" placeholder="Type your thought, idea, or memory..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Emotion</label>
                    <select id="emotion">
                        <option value="calm">Calm</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Priority</label>
                    <div class="priority-slider">
                        <input type="range" id="priority" min="1" max="10" value="5">
                        <span class="priority-value" id="priority-value">5</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Context/Tags (optional)</label>
                    <input type="text" id="context" placeholder="Add tags or context...">
                </div>
                
                <button onclick="addMemory()">Save Memory</button>
            </div>
            
            <!-- DECISION ENGINE CARD -->
            <div class="card">
                <h2><span class="emoji">🎯</span> Decision Engine</h2>
                <div id="decision-output" class="loading">Click button to analyze...</div>
                <button onclick="getDecision()" style="margin-top: 15px;">Analyze Now</button>
            </div>
            
            <!-- MEMORY STATS CARD -->
            <div class="card">
                <h2><span class="emoji">📊</span> Memory Stats</h2>
                <div id="stats-output" class="loading">Loading...</div>
            </div>
            
            <!-- GENERATE CONTENT CARD -->
            <div class="card">
                <h2><span class="emoji">🔥</span> Generate Content</h2>
                <p style="color: #aaa; margin-bottom: 15px;">Create hooks, stories, and brand lines from your memories.</p>
                <button onclick="generateContent()">Generate Now</button>
                <div id="content-output"></div>
            </div>
            
            <!-- SEARCH CARD -->
            <div class="card">
                <h2><span class="emoji">🔍</span> Search</h2>
                <div class="search-box">
                    <div class="search-input">
                        <input type="text" id="search-query" placeholder="Search memories...">
                        <button onclick="searchMemories()">Search</button>
                    </div>
                </div>
                <div id="search-results"></div>
            </div>
            
            <!-- VIEW MEMORIES CARD -->
            <div class="card">
                <h2><span class="emoji">📖</span> Your Memories</h2>
                <div id="memories-output" class="loading">Loading...</div>
            </div>
        </div>
    </div>
    
    <script>
        // Load emotions on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadEmotions();
            loadMemories();
            loadStats();
            
            // Update priority value display
            document.getElementById('priority').addEventListener('input', function() {
                document.getElementById('priority-value').textContent = this.value;
            });
        });
        
        function loadEmotions() {
            fetch('/api/emotions')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('emotion');
                    select.innerHTML = '';
                    data.emotions.forEach(emotion => {
                        const option = document.createElement('option');
                        option.value = emotion;
                        option.textContent = emotion.charAt(0).toUpperCase() + emotion.slice(1);
                        select.appendChild(option);
                    });
                });
        }
        
        function addMemory() {
            const content = document.getElementById('memory-content').value;
            const emotion = document.getElementById('emotion').value;
            const priority = document.getElementById('priority').value;
            const context = document.getElementById('context').value;
            
            if (!content.trim()) {
                alert('Memory cannot be empty!');
                return;
            }
            
            fetch('/api/memories/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content, emotion, priority, context})
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('memory-content').value = '';
                document.getElementById('context').value = '';
                document.getElementById('priority').value = '5';
                document.getElementById('priority-value').textContent = '5';
                
                const msg = document.getElementById('success-message');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 2000);
                
                loadMemories();
                loadStats();
            });
        }
        
        function loadMemories() {
            fetch('/api/memories')
                .then(r => r.json())
                .then(data => {
                    let html = '';
                    if (data.memories.length === 0) {
                        html = '<p style="color: #888;">No memories yet. Start logging!</p>';
                    } else {
                        data.memories.forEach(m => {
                            html += `
                                <div class="memory-item">
                                    <div class="memory-content">${m.content}</div>
                                    <div class="memory-meta">
                                        <span class="memory-emotion">${m.emotion}</span>
                                        <span>Priority: ${m.priority}/10</span>
                                        <button class="delete-btn" onclick="deleteMemory(${m.id})">Delete</button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    document.getElementById('memories-output').innerHTML = html;
                });
        }
        
        function deleteMemory(id) {
            if (confirm('Delete this memory?')) {
                fetch(`/api/memories/${id}`, {method: 'DELETE'})
                    .then(r => r.json())
                    .then(() => {
                        loadMemories();
                        loadStats();
                    });
            }
        }
        
        function getDecision() {
            document.getElementById('decision-output').innerHTML = '<div class="loading">Analyzing...</div>';
            fetch('/api/decision')
                .then(r => r.json())
                .then(data => {
                    let html = `
                        <div class="decision-box">
                            <div class="decision-title">🎯 ${data.decision}</div>
                            <div class="decision-reason">${data.reason}</div>
                            <div class="decision-action"><strong>⚡ Action:</strong> ${data.action}</div>
                            <div class="metrics">
                                <div class="metric">
                                    <div class="metric-label">Priority</div>
                                    <div class="metric-value">${data.metrics.avg_priority}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Emotion</div>
                                    <div class="metric-value">${data.metrics.avg_emotion_score}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Memories</div>
                                    <div class="metric-value">${data.metrics.total_memories}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    document.getElementById('decision-output').innerHTML = html;
                });
        }
        
        function generateContent() {
            document.getElementById('content-output').innerHTML = '<div class="loading">Generating...</div>';
            fetch('/api/content/generate')
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('content-output').innerHTML = `<p style="color: #f44;">${data.error}</p>`;
                        return;
                    }
                    
                    let html = `
                        <div class="content-output">
                            <h3>🎯 Hook</h3>
                            <p>${data.hook}</p>
                            <h3>📖 Story</h3>
                            <p>${data.story}</p>
                            <h3>💪 Mantra</h3>
                            <p>${data.mantra}</p>
                            <h3>🏷️ Brand Line</h3>
                            <p>${data.brand_line}</p>
                        </div>
                    `;
                    document.getElementById('content-output').innerHTML = html;
                });
        }
        
        function loadStats() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    let html = `
                        <div class="metrics" style="margin-top: 0;">
                            <div class="metric">
                                <div class="metric-label">Total Memories</div>
                                <div class="metric-value">${data.total_entries}</div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Avg Priority</div>
                                <div class="metric-value">${data.avg_priority}</div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Avg Emotion</div>
                                <div class="metric-value">${data.avg_emotion_score}</div>
                            </div>
                        </div>
                    `;
                    document.getElementById('stats-output').innerHTML = html;
                });
        }
        
        function searchMemories() {
            const query = document.getElementById('search-query').value;
            if (!query.trim()) return;
            
            fetch('/api/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query})
            })
            .then(r => r.json())
            .then(data => {
                let html = '';
                if (data.results.length === 0) {
                    html = '<p style="color: #888;">No results found.</p>';
                } else {
                    data.results.forEach(m => {
                        html += `
                            <div class="memory-item">
                                <div class="memory-content">${m.content}</div>
                                <div class="memory-meta">
                                    <span class="memory-emotion">${m.emotion}</span>
                                    <span>Priority: ${m.priority}/10</span>
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('search-results').innerHTML = html;
            });
        }
    </script>
</body>
</html>
